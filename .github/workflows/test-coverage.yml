name: Unit tests and coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # The app reads its config from `.env` (SvelteKit's $env modules). Locally
      # every developer has one; CI has none, so svelte-check typed ORIGIN, VAPID_*
      # and PUBLIC_POSTHOG_* as missing and the unit tests found no DATABASE_URL.
      # Give CI the committed template — non-secret, local-test values only. App
      # code keeps failing loud on missing env; this only supplies it.
      - name: CI env from .env.example
        run: cp .env.example .env

      - name: Lint
        run: npm run lint

      - name: Svelte naming
        run: npm run assert:svelte-naming

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

  components:
    name: Component browser tests
    # ubuntu-latest moved to 26.04, which Playwright 1.59 refuses
    # ("does not support chromium on ubuntu26.04-x64"). Pinned like release.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # The app reads its config from `.env` (SvelteKit's $env modules). Locally
      # every developer has one; CI has none, so svelte-check typed ORIGIN, VAPID_*
      # and PUBLIC_POSTHOG_* as missing and the unit tests found no DATABASE_URL.
      # Give CI the committed template — non-secret, local-test values only. App
      # code keeps failing loud on missing env; this only supplies it.
      - name: CI env from .env.example
        run: cp .env.example .env

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Component browser tests
        run: npm run test:components

  coverage:
    name: Coverage report (thresholds not yet merge-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Thresholds in vite.config.ts are the product target (95%/80%) but floors are
    # ratcheted to current measured coverage (~89% lines / ~77% branches critical).
    # Report the gap without blocking merges; raise floors toward the target and
    # flip this to a required check when green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # The app reads its config from `.env` (SvelteKit's $env modules). Locally
      # every developer has one; CI has none, so svelte-check typed ORIGIN, VAPID_*
      # and PUBLIC_POSTHOG_* as missing and the unit tests found no DATABASE_URL.
      # Give CI the committed template — non-secret, local-test values only. App
      # code keeps failing loud on missing env; this only supplies it.
      - name: CI env from .env.example
        run: cp .env.example .env

      - name: Unit tests with coverage thresholds
        run: npm run test:coverage
        env:
          CI: true
