# Publishes an eigenEnterprise release on a v* tag (scripts/release.sh, plan/phase-substrate.md D7).
#
# Each CPU builds on its own native runner (no emulation), then one job publishes
# a GitHub Release with: LATEST, DOWNGRADE_FLOOR, UPGRADE.json, install.sh, ee.mjs (+ .sha256) and
# eigenenterprise-<version>-<sha>-linux-{x64,arm64}.tar.gz (+ .sha256) and
# livekit-server-<version>-linux-{x64,arm64}.tar.gz (+ .sha256), which install.sh fetches for calls,
# chromium-headless-shell-<revision>-linux-{x64,arm64}.tar.gz (+ .sha256), the chromium capability (brand site capture),
# plus SHA256SUMS over all of them and SHA256SUMS.sig (Ed25519, secret EE_RELEASE_SIGNING_KEY).
#
# Install:  curl -fsSL https://github.com/hikaru90/eigen-enterprise/releases/latest/download/install.sh \
#             | sh -s -- --from https://github.com/hikaru90/eigen-enterprise/releases/latest/download
# Upgrade:  ee upgrade
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes (NOTES.md) are the commits since the previous v* tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag is the package version
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2; exit 1; }
      - name: Build the ${{ matrix.arch }} release
        run: bash scripts/release.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/release/LATEST
            dist/release/NOTES.md
            dist/release/DOWNGRADE_FLOOR
            dist/release/UPGRADE.json
            dist/release/install.sh
            dist/release/ee.mjs
            dist/release/ee.mjs.sha256
            dist/release/eigenenterprise-*.tar.gz
            dist/release/eigenenterprise-*.tar.gz.sha256
            dist/release/livekit-server-*.tar.gz
            dist/release/livekit-server-*.tar.gz.sha256
            dist/release/chromium-headless-shell-*.tar.gz
            dist/release/chromium-headless-shell-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Both builds agree on the release name, the installer and ee
        run: |
          for f in LATEST NOTES.md DOWNGRADE_FLOOR UPGRADE.json install.sh ee.mjs.sha256; do
            cmp built/release-amd64/$f built/release-arm64/$f || { echo "$f differs between the amd64 and arm64 builds" >&2; exit 1; }
          done
          mkdir out
          cp built/release-amd64/{LATEST,NOTES.md,DOWNGRADE_FLOOR,UPGRADE.json,install.sh,ee.mjs,ee.mjs.sha256} out/
          cp built/release-*/eigenenterprise-*.tar.gz* out/
          cp built/release-*/livekit-server-*.tar.gz* out/
          cp built/release-*/chromium-headless-shell-*.tar.gz* out/
          (cd out && sha256sum -c --quiet *.sha256)
      - name: Sign the release (SHA256SUMS + Ed25519 SHA256SUMS.sig, verified by install.sh and ee upgrade)
        env:
          EE_RELEASE_SIGNING_KEY: ${{ secrets.EE_RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$EE_RELEASE_SIGNING_KEY" ] || { echo "the EE_RELEASE_SIGNING_KEY secret is not set (scripts/release-key.sh prints how) — refusing to publish an unsigned release" >&2; exit 1; }
          key=$(mktemp) && trap 'rm -f "$key"' EXIT
          printf '%s\n' "$EE_RELEASE_SIGNING_KEY" > "$key"
          # The per-file .sha256 files stay for older installers; SHA256SUMS covers every published asset.
          (cd out && rm -f SHA256SUMS SHA256SUMS.sig && sha256sum $(ls | grep -v '\.sha256$') > ../SHA256SUMS)
          mv SHA256SUMS out/SHA256SUMS
          openssl pkeyutl -sign -rawin -inkey "$key" -in out/SHA256SUMS | openssl base64 -A > out/SHA256SUMS.sig
          openssl pkey -in "$key" -pubout > release-public.pem
          openssl base64 -d -A < out/SHA256SUMS.sig > sig.bin
          openssl pkeyutl -verify -pubin -inkey release-public.pem -rawin -in out/SHA256SUMS -sigfile sig.bin
          cat out/SHA256SUMS
          ls -la out
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat out/NOTES.md
            printf '\nRelease %s.\n\nInstall on a fresh Ubuntu 24.04 / Debian 13 server (as root):\n\n    curl -fsSL https://github.com/%s/releases/latest/download/install.sh | sh -s -- --from https://github.com/%s/releases/latest/download\n\nUpdate an installed server from Settings → Updates, or run `ee upgrade` on it (it keeps everything).\n' "$(cat out/LATEST)" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "eigenEnterprise $GITHUB_REF_NAME" \
            --latest \
            --notes-file notes.md
