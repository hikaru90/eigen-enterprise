<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="theme-color" content="#e8ede5" id="theme-color-meta" />
    <meta name="description" content="The website is your company." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <meta name="text-scale" content="scale" />
    <title>Eigen Enterprise</title>
    <script>
      ;(function () {
        var pref = localStorage.getItem('theme-preference')
        var isDark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (isDark) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        } else {
          document.documentElement.style.colorScheme = 'light'
        }
        var themeMeta = document.getElementById('theme-color-meta')
        if (themeMeta) {
          themeMeta.setAttribute('content', isDark ? '#141c16' : '#e8ede5')
        }
      })()
    </script>
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
